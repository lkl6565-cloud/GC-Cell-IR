<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>지씨셀 IR 법령 조회</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
               background-color: #09090b; color: #f4f4f5; -webkit-tap-highlight-color: transparent; }
        .spin-animation { animation: spin 0.8s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: #18181b; }
        ::-webkit-scrollbar-thumb { background: #27272a; border-radius: 2px; }
        .law-text { white-space: pre-wrap; word-break: keep-all; line-height: 1.75; }
        mark { background: rgba(16,185,129,.25); color: #a7f3d0; border-radius: 2px; padding: 0 1px; }
    </style>
</head>
<body class="min-h-screen pb-16">

<header class="border-b border-zinc-800/80 bg-zinc-950/80 sticky top-0 z-50 backdrop-blur-xl">
    <div class="max-w-4xl mx-auto px-4 h-14 flex items-center justify-between">
        <div class="flex items-center space-x-2.5">
            <div class="w-7 h-7 rounded-lg bg-emerald-500/10 border border-emerald-500/20 flex items-center justify-center text-emerald-400 font-bold text-xs">GC</div>
            <h1 class="text-xs font-bold text-white tracking-tight flex items-center gap-1.5">
                지씨셀 IR 법령 조회
                <span class="px-1.5 py-0.5 text-[9px] bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 rounded font-mono">LAW</span>
            </h1>
        </div>
        <a href="/" class="flex items-center space-x-1.5 bg-zinc-900 hover:bg-zinc-800 text-zinc-200 px-3 py-1.5 rounded-lg text-xs border border-zinc-800">
            <i data-lucide="layout-dashboard" class="w-3.5 h-3.5 text-emerald-400"></i><span class="font-medium">일일보고</span>
        </a>
    </div>
</header>

<main class="max-w-4xl mx-auto px-4 mt-6 space-y-5">

    <section class="bg-zinc-900/80 border border-zinc-800/80 rounded-2xl p-5 space-y-4 shadow-xl">
        <div class="flex items-center justify-between border-b border-zinc-800/80 pb-3">
            <h2 class="text-sm font-bold text-white flex items-center gap-1.5">
                <i data-lucide="scale" class="w-4 h-4 text-emerald-400"></i> 조문 찾기
            </h2>
            <span class="text-[10px] px-2 py-0.5 bg-zinc-800 text-zinc-300 rounded">국가법령정보센터 현행 기준</span>
        </div>

        <div id="presets" class="flex flex-wrap gap-1.5"></div>

        <div class="grid grid-cols-1 sm:grid-cols-12 gap-2">
            <input id="law" class="sm:col-span-5 bg-zinc-950 border border-zinc-800 rounded-lg px-3 py-2 text-xs focus:outline-none focus:border-emerald-600"
                   placeholder="법령명 (예: 자본시장법, 상법)" value="자본시장법">
            <input id="jo" class="sm:col-span-2 bg-zinc-950 border border-zinc-800 rounded-lg px-3 py-2 text-xs focus:outline-none focus:border-emerald-600"
                   placeholder="조문 (174, 2-12의2)">
            <input id="kw" class="sm:col-span-3 bg-zinc-950 border border-zinc-800 rounded-lg px-3 py-2 text-xs focus:outline-none focus:border-emerald-600"
                   placeholder="또는 키워드 (단기매매차익)">
            <button id="btn-go" onclick="lookup()" class="sm:col-span-2 flex items-center justify-center gap-1.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg text-xs font-semibold py-2">
                <i data-lucide="search" id="go-icon" class="w-3.5 h-3.5"></i><span>조회</span>
            </button>
        </div>
        <p class="text-[11px] text-zinc-500">조문 번호를 비우고 조회하면 목차가 나옵니다. 코스닥시장 공시규정 등 거래소 규정은 이 서비스에 없어 <a class="underline" href="https://law.krx.co.kr" target="_blank" rel="noopener">KRX 법규서비스</a>를 이용하세요.</p>
    </section>

    <section id="result" class="hidden bg-zinc-900/80 border border-zinc-800/80 rounded-2xl p-5 space-y-4 shadow-xl">
        <div class="flex items-start justify-between gap-3 border-b border-zinc-800/80 pb-3">
            <div>
                <h2 id="r-name" class="text-sm font-bold text-white"></h2>
                <p id="r-meta" class="text-[11px] text-zinc-400 mt-0.5"></p>
            </div>
            <a id="r-src" target="_blank" rel="noopener" class="shrink-0 text-[11px] text-emerald-400 hover:underline flex items-center gap-1">
                원문 <i data-lucide="external-link" class="w-3 h-3"></i></a>
        </div>
        <div id="r-body" class="space-y-4"></div>
    </section>

    <div id="err" class="hidden text-xs text-rose-300 bg-rose-950/40 border border-rose-900/60 rounded-xl p-3"></div>
</main>

<script>
const $ = id => document.getElementById(id);
const esc = s => (s || '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtDate = d => d && d.length === 8 ? `${d.slice(0,4)}.${d.slice(4,6)}.${d.slice(6)}` : (d || '');
let current = null;   // 마지막 조회 결과 (목차 클릭 시 재사용)

async function loadPresets() {
    const r = await fetch('/api/law/presets'); const list = await r.json();
    $('presets').innerHTML = list.map(p =>
        `<button onclick="pick('${esc(p.name)}')" class="px-2.5 py-1 text-[11px] rounded-lg bg-zinc-950 border border-zinc-800 hover:border-emerald-600 text-zinc-300">${esc(p.name)}</button>`).join('');
}
function pick(name) { $('law').value = name; $('jo').value = ''; $('kw').value = ''; lookup(); }

async function lookup(extra) {
    const law = $('law').value.trim(); const jo = $('jo').value.trim(); const kw = $('kw').value.trim();
    if (!law && !(extra && extra.id)) return;
    const q = new URLSearchParams({ law });
    if (jo) q.set('jo', jo); else if (kw) q.set('keyword', kw);
    if (extra) Object.entries(extra).forEach(([k, v]) => q.set(k, v));
    $('err').classList.add('hidden'); $('go-icon').classList.add('spin-animation'); $('btn-go').disabled = true;
    try {
        const r = await fetch('/api/law/article?' + q); const d = await r.json();
        if (!r.ok || d.error) throw new Error(d.error || r.status);
        current = d; render(d, kw && !jo ? kw : '');
    } catch (e) {
        $('err').textContent = '조회 실패: ' + e.message; $('err').classList.remove('hidden');
    } finally { $('go-icon').classList.remove('spin-animation'); $('btn-go').disabled = false; }
}

function render(d, kw) {
    $('result').classList.remove('hidden');
    $('r-name').textContent = d.name + (d.short ? ` (${d.short})` : '');
    $('r-meta').textContent = [d.kind, d.target === 'admrul' ? `발령 ${fmtDate(d.effective)}` : `시행 ${fmtDate(d.effective)}`,
                               d.target === 'law' && d.promulgated ? `공포 ${fmtDate(d.promulgated)}` : ''].filter(Boolean).join(' · ');
    $('r-src').href = d.source;
    if (d.toc) {
        $('r-body').innerHTML = `<div class="grid grid-cols-1 sm:grid-cols-2 gap-1 max-h-[60vh] overflow-y-auto pr-1">` +
            d.toc.map(t => `<button onclick="openJo('${esc(t.no)}')" class="text-left text-[12px] text-zinc-300 hover:text-emerald-300 px-2 py-1 rounded hover:bg-zinc-800/60">${esc(t.title)}</button>`).join('') + `</div>`;
    } else if (!d.articles.length) {
        $('r-body').innerHTML = `<p class="text-xs text-zinc-400">'${esc(kw)}'가 들어간 조문이 없습니다.</p>`;
    } else {
        $('r-body').innerHTML = (kw ? `<p class="text-[11px] text-zinc-400">'${esc(kw)}' 포함 조문 ${d.articles.length}건${d.articles.length >= 30 ? ' (최대 30건 표시)' : ''}</p>` : '') +
            d.articles.map((a, i) => `
            <article class="bg-zinc-950/60 border border-zinc-800 rounded-xl p-4 space-y-2">
                <div class="flex items-center justify-between gap-2">
                    <h3 class="text-[13px] font-semibold text-emerald-300">${esc(a.title)}</h3>
                    <div class="flex items-center gap-2 shrink-0">
                        ${a.effective ? `<span class="text-[10px] text-zinc-500">조문 시행 ${fmtDate(a.effective)}</span>` : ''}
                        <button onclick="copyArt(${i})" class="text-[11px] flex items-center gap-1 px-2 py-1 rounded-lg bg-zinc-900 border border-zinc-800 hover:border-emerald-600 text-zinc-300">
                            <i data-lucide="copy" class="w-3 h-3"></i><span id="cp-${i}">보고용 복사</span></button>
                    </div>
                </div>
                <div class="law-text text-[12.5px] text-zinc-200">${highlight(esc(a.text), kw)}</div>
            </article>`).join('');
    }
    lucide.createIcons();
}

function highlight(html, kw) {
    if (!kw) return html;
    const k = esc(kw).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    return html.replace(new RegExp(k, 'g'), m => `<mark>${m}</mark>`);
}

function openJo(no) { $('jo').value = no; $('kw').value = ''; lookup({ id: current.id, target: current.target }); }

// 보고 메일 양식: [자본시장법 제174조] (시행 2026.11.13, 국가법령정보센터) + 원문
function copyArt(i) {
    const d = current, a = d.articles[i];
    const lawName = d.short || d.name;
    const head = `[${lawName} ${a.title.replace(/\(.*$/, '')}] (${d.target === 'admrul' ? '발령' : '시행'} ${fmtDate(a.effective || d.effective)}, 출처: 국가법령정보센터)`;
    navigator.clipboard.writeText(`${head}\n${a.text}`).then(() => {
        $('cp-' + i).textContent = '복사됨'; setTimeout(() => $('cp-' + i).textContent = '보고용 복사', 1500);
    });
}

['law', 'jo', 'kw'].forEach(id => $(id).addEventListener('keydown', e => { if (e.key === 'Enter') lookup(); }));
const qs = new URLSearchParams(location.search);
if (qs.get('law')) $('law').value = qs.get('law');
if (qs.get('jo')) $('jo').value = qs.get('jo');
loadPresets(); lucide.createIcons();
if (qs.get('law')) lookup();
</script>
</body>
</html>
